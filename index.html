<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nursing Log</title>
<meta name="description" content="A simple, private breastfeeding tracker.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8d5b74">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #fdf7f9;
    --surface: #ffffff;
    --surface-2: #f6eef2;
    --line: #e8d9e1;
    --text: #2e2429;
    --muted: #7c6a73;
    --accent: #8d5b74;
    --accent-soft: #f3e3ea;
    --left: #4f7cac;
    --right: #b2705a;
    --both: #6f8f6a;
    --danger: #b3261e;
    --radius: 18px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171316;
      --surface: #211c1f;
      --surface-2: #2b2429;
      --line: #3a3136;
      --text: #f0e7ec;
      --muted: #a9989f;
      --accent: #e0aac4;
      --accent-soft: #3a2c34;
      --left: #8fb4dd;
      --right: #e2a48e;
      --both: #a3c69c;
      --danger: #f2b8b5;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    padding-bottom: calc(24px + var(--safe-bottom));
    overscroll-behavior-y: contain;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 18px 0 12px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    width: 44px; height: 44px; border-radius: 50%; font-size: 20px;
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { background: var(--surface-2); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  }

  /* ---------- timer card ---------- */
  .since { text-align: center; color: var(--muted); font-size: 15px; }
  .since b { color: var(--text); font-weight: 600; }
  .elapsed {
    text-align: center; font-size: 54px; font-weight: 300; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; margin: 6px 0 2px;
  }
  .running-side { text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 14px; }
  .prompt { text-align: center; color: var(--muted); font-size: 14px; margin: 14px 0 10px; }

  .side-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .side-btn {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    border-radius: 14px; padding: 16px 6px; font-size: 17px; font-weight: 600;
    cursor: pointer; display: grid; gap: 4px; place-items: center;
  }
  .side-btn small { font-weight: 400; font-size: 12px; color: var(--muted); }
  .side-btn:active { transform: scale(0.98); }
  .side-btn.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .side-btn.sel small { color: var(--accent); }

  .big-btn {
    width: 100%; border: none; border-radius: 14px; padding: 18px;
    font-size: 18px; font-weight: 700; cursor: pointer;
    background: var(--accent); color: #fff; margin-top: 12px;
  }
  @media (prefers-color-scheme: dark) { .big-btn { color: #2a1b23; } }
  .big-btn:active { filter: brightness(0.95); }
  .text-btn {
    width: 100%; background: none; border: none; color: var(--muted);
    font-size: 15px; padding: 12px; margin-top: 4px; cursor: pointer;
  }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; }
  .stats div + div { border-left: 1px solid var(--line); }
  .stats .n { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stats .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  /* ---------- history ---------- */
  h2.day {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 22px 0 8px; display: flex; justify-content: space-between;
  }
  h2.day span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .entry {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px; cursor: pointer; color: var(--text);
    font-family: inherit; font-size: 16px;
  }
  .entry:active { background: var(--surface-2); }
  .pill {
    flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: 15px; color: #fff;
  }
  @media (prefers-color-scheme: dark) { .pill { color: #1d1418; } }
  .pill.L { background: var(--left); } .pill.R { background: var(--right); } .pill.B { background: var(--both); }
  .entry .meta { flex: 1; min-width: 0; }
  .entry .time { font-weight: 600; }
  .entry .sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 15px; }

  /* ---------- sheet / modal ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .scrim[hidden] { display: none; }
  .sheet {
    background: var(--bg); width: 100%; max-width: 560px;
    border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + var(--safe-bottom));
    max-height: 92vh; overflow-y: auto;
  }
  .sheet h3 { margin: 0 0 16px; font-size: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input[type="date"], input[type="time"], input[type="number"], textarea, select {
    width: 100%; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 13px 12px;
  }
  textarea { resize: vertical; min-height: 80px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .btn {
    border-radius: 13px; padding: 15px; font-size: 16px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font-family: inherit;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #2a1b23; } }
  .btn.danger { color: var(--danger); }
  .btn.wide { grid-column: 1 / -1; }

  .menu-item {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: var(--text); font: inherit; padding: 16px 8px; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .menu-item:last-of-type { border-bottom: none; }
  .menu-item small { display: block; color: var(--muted); font-size: 13px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + var(--safe-bottom)); background: var(--text); color: var(--bg);
    padding: 12px 18px; border-radius: 30px; font-size: 15px; z-index: 100;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25); max-width: 90vw; text-align: center;
  }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Nursing Log</h1>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">&#9881;</button>
  </header>

  <!-- Timer -->
  <section class="card" id="timerCard">
    <div id="idleView">
      <div class="since" id="sinceText">No feedings recorded yet</div>
      <div class="prompt">Start a feeding</div>
      <div class="side-row">
        <button class="side-btn" data-start="L">L<small>Left</small></button>
        <button class="side-btn" data-start="R">R<small>Right</small></button>
        <button class="side-btn" data-start="B">B<small>Both</small></button>
      </div>
      <button class="text-btn" id="addManualBtn">+ Add a past feeding</button>
    </div>

    <div id="runningView" hidden>
      <div class="since">Feeding since <b id="startedAt">—</b></div>
      <div class="elapsed" id="elapsed">0:00</div>
      <div class="running-side">Tap to change side</div>
      <div class="side-row">
        <button class="side-btn" data-switch="L">L<small>Left</small></button>
        <button class="side-btn" data-switch="R">R<small>Right</small></button>
        <button class="side-btn" data-switch="B">B<small>Both</small></button>
      </div>
      <button class="big-btn" id="stopBtn">Stop &amp; Save</button>
      <button class="text-btn" id="cancelBtn">Cancel without saving</button>
    </div>
  </section>

  <!-- Today -->
  <section class="card stats">
    <div><div class="n" id="statCount">0</div><div class="l">Feeds today</div></div>
    <div><div class="n" id="statMinutes">0</div><div class="l">Minutes</div></div>
    <div><div class="n" id="statLast">—</div><div class="l">Last side</div></div>
  </section>

  <!-- History -->
  <div id="history"></div>

</div>

<!-- Entry editor -->
<div class="scrim" id="editorScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="editorTitle">Edit feeding</h3>

    <label>Side</label>
    <div class="side-row">
      <button class="side-btn" data-pick="L">L<small>Left</small></button>
      <button class="side-btn" data-pick="R">R<small>Right</small></button>
      <button class="side-btn" data-pick="B">B<small>Both</small></button>
    </div>

    <div class="two">
      <div><label for="fDate">Date</label><input type="date" id="fDate"></div>
      <div><label for="fTime">Start time</label><input type="time" id="fTime"></div>
    </div>

    <label for="fDuration">Duration (minutes)</label>
    <input type="number" id="fDuration" min="0" max="600" inputmode="numeric" step="1">

    <label for="fNotes">Notes</label>
    <textarea id="fNotes" placeholder="Fussy, spit up, fell asleep, vitamin D…"></textarea>

    <div class="sheet-actions">
      <button class="btn" id="editorCancel">Cancel</button>
      <button class="btn primary" id="editorSave">Save</button>
      <button class="btn danger wide" id="editorDelete" hidden>Delete this feeding</button>
    </div>
  </div>
</div>

<!-- Menu -->
<div class="scrim" id="menuScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h3>Data &amp; backup</h3>
    <button class="menu-item" id="exportCsv">Export spreadsheet (CSV)<small>Open in Excel or Google Sheets</small></button>
    <button class="menu-item" id="exportJson">Save backup file<small>Everything, so you can restore it later</small></button>
    <button class="menu-item" id="importJson">Restore from backup<small>Adds feedings from a backup file</small></button>
    <button class="menu-item" id="aboutBtn">About this app<small>Where your data lives</small></button>
    <div class="sheet-actions">
      <button class="btn wide" id="menuClose">Close</button>
    </div>
    <input type="file" id="fileInput" accept="application/json,.json" hidden>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "nursinglog.entries.v1";
  var ACTIVE_KEY = "nursinglog.active.v1";
  var SIDE_NAME = { L: "Left", R: "Right", B: "Both" };

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- storage ---------------- */

  function loadEntries() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var list = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(list)) return [];
      return list.filter(function (e) {
        return e && typeof e.start === "number" && SIDE_NAME[e.side];
      });
    } catch (err) {
      return [];
    }
  }

  function saveEntries(list) {
    list.sort(function (a, b) { return b.start - a.start; });
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(list));
    } catch (err) {
      toast("Could not save — phone storage may be full");
    }
    entries = list;
  }

  function loadActive() {
    try {
      var a = JSON.parse(localStorage.getItem(ACTIVE_KEY) || "null");
      if (a && typeof a.start === "number" && SIDE_NAME[a.side]) return a;
    } catch (err) { /* ignore */ }
    return null;
  }

  function setActive(a) {
    active = a;
    if (a) localStorage.setItem(ACTIVE_KEY, JSON.stringify(a));
    else localStorage.removeItem(ACTIVE_KEY);
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  var entries = loadEntries();
  var active = loadActive();

  /* ---------------- formatting ---------------- */

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function clockTime(ms) {
    return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function stopwatch(seconds) {
    var m = Math.floor(seconds / 60), s = seconds % 60;
    if (m >= 60) return Math.floor(m / 60) + ":" + pad(m % 60) + ":" + pad(s);
    return m + ":" + pad(s);
  }

  function durationText(minutes) {
    if (minutes < 1) return "less than a minute";
    if (minutes < 60) return minutes + " min";
    var h = Math.floor(minutes / 60), m = minutes % 60;
    return m ? h + "h " + m + "m" : h + "h";
  }

  function agoText(ms) {
    var mins = Math.floor((Date.now() - ms) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + " min ago";
    var h = Math.floor(mins / 60), m = mins % 60;
    return (m ? h + "h " + m + "m" : h + "h") + " ago";
  }

  function dayKey(ms) {
    var d = new Date(ms);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function dayLabel(key) {
    var today = dayKey(Date.now());
    var yesterday = dayKey(Date.now() - 86400000);
    if (key === today) return "Today";
    if (key === yesterday) return "Yesterday";
    var p = key.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* ---------------- rendering ---------------- */

  function markSelected(container, attr, value) {
    var btns = container.querySelectorAll("[" + attr + "]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle("sel", btns[i].getAttribute(attr) === value);
    }
  }

  function renderTimer() {
    var idle = $("idleView"), running = $("runningView");
    if (active) {
      idle.hidden = true;
      running.hidden = false;
      $("startedAt").textContent = clockTime(active.start);
      markSelected(running, "data-switch", active.side);
      tick();
    } else {
      idle.hidden = false;
      running.hidden = true;
      var last = entries[0];
      $("sinceText").innerHTML = last
        ? "Last fed <b>" + agoText(last.start) + "</b> &middot; " + SIDE_NAME[last.side]
        : "No feedings recorded yet";
    }
  }

  function tick() {
    if (!active) return;
    var secs = Math.max(0, Math.floor((Date.now() - active.start) / 1000));
    $("elapsed").textContent = stopwatch(secs);
  }

  function renderStats() {
    var today = dayKey(Date.now());
    var count = 0, minutes = 0, lastSide = "—";
    for (var i = 0; i < entries.length; i++) {
      if (dayKey(entries[i].start) === today) {
        count++;
        minutes += entries[i].minutes;
        if (lastSide === "—") lastSide = SIDE_NAME[entries[i].side];
      }
    }
    $("statCount").textContent = count;
    $("statMinutes").textContent = minutes;
    $("statLast").textContent = lastSide;
  }

  function renderHistory() {
    var host = $("history");
    host.textContent = "";

    if (!entries.length) {
      var p = document.createElement("div");
      p.className = "empty";
      p.textContent = "Feedings you record will show up here.";
      host.appendChild(p);
      return;
    }

    var currentDay = null, dayTotal = null;

    entries.forEach(function (e) {
      var key = dayKey(e.start);
      if (key !== currentDay) {
        currentDay = key;
        var count = 0, mins = 0;
        entries.forEach(function (x) {
          if (dayKey(x.start) === key) { count++; mins += x.minutes; }
        });
        var h = document.createElement("h2");
        h.className = "day";
        var name = document.createElement("strong");
        name.textContent = dayLabel(key);
        var sum = document.createElement("span");
        sum.textContent = count + (count === 1 ? " feed" : " feeds") + " · " + mins + " min";
        h.appendChild(name);
        h.appendChild(sum);
        host.appendChild(h);
      }

      var row = document.createElement("button");
      row.className = "entry";
      row.type = "button";

      var pill = document.createElement("div");
      pill.className = "pill " + e.side;
      pill.textContent = e.side;

      var meta = document.createElement("div");
      meta.className = "meta";
      var time = document.createElement("div");
      time.className = "time";
      time.textContent = clockTime(e.start) + " · " + durationText(e.minutes);
      var sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = e.notes ? e.notes : SIDE_NAME[e.side];
      meta.appendChild(time);
      meta.appendChild(sub);

      row.appendChild(pill);
      row.appendChild(meta);
      row.addEventListener("click", function () { openEditor(e.id); });
      host.appendChild(row);
    });
  }

  function renderAll() {
    renderTimer();
    renderStats();
    renderHistory();
  }

  /* ---------------- timer actions ---------------- */

  document.querySelectorAll("[data-start]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      setActive({ start: Date.now(), side: btn.getAttribute("data-start") });
      renderAll();
    });
  });

  document.querySelectorAll("[data-switch]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (!active) return;
      setActive({ start: active.start, side: btn.getAttribute("data-switch") });
      markSelected($("runningView"), "data-switch", active.side);
    });
  });

  $("stopBtn").addEventListener("click", function () {
    if (!active) return;
    var minutes = Math.max(1, Math.round((Date.now() - active.start) / 60000));
    var entry = {
      id: newId(),
      start: active.start,
      minutes: minutes,
      side: active.side,
      notes: ""
    };
    var list = entries.slice();
    list.push(entry);
    saveEntries(list);
    setActive(null);
    renderAll();
    toast("Saved " + durationText(minutes) + " · " + SIDE_NAME[entry.side]);
  });

  $("cancelBtn").addEventListener("click", function () {
    if (confirm("Discard this feeding without saving?")) {
      setActive(null);
      renderAll();
    }
  });

  /* ---------------- editor ---------------- */

  var editingId = null;
  var editorSide = "L";

  function openEditor(id) {
    var e = null;
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].id === id) { e = entries[i]; break; }
    }

    editingId = e ? e.id : null;
    editorSide = e ? e.side : "L";

    var when = e ? new Date(e.start) : new Date();
    $("editorTitle").textContent = e ? "Edit feeding" : "Add a feeding";
    $("fDate").value = when.getFullYear() + "-" + pad(when.getMonth() + 1) + "-" + pad(when.getDate());
    $("fTime").value = pad(when.getHours()) + ":" + pad(when.getMinutes());
    $("fDuration").value = e ? e.minutes : 15;
    $("fNotes").value = e ? e.notes : "";
    $("editorDelete").hidden = !e;

    markSelected($("editorScrim"), "data-pick", editorSide);
    $("editorScrim").hidden = false;
  }

  function closeEditor() {
    $("editorScrim").hidden = true;
    editingId = null;
  }

  document.querySelectorAll("[data-pick]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      editorSide = btn.getAttribute("data-pick");
      markSelected($("editorScrim"), "data-pick", editorSide);
    });
  });

  $("addManualBtn").addEventListener("click", function () { openEditor(null); });
  $("editorCancel").addEventListener("click", closeEditor);

  $("editorSave").addEventListener("click", function () {
    var dateVal = $("fDate").value;
    var timeVal = $("fTime").value;
    if (!dateVal || !timeVal) { toast("Please set a date and time"); return; }

    var dp = dateVal.split("-");
    var tp = timeVal.split(":");
    var start = new Date(+dp[0], +dp[1] - 1, +dp[2], +tp[0], +tp[1], 0, 0).getTime();
    if (isNaN(start)) { toast("That date and time didn't look right"); return; }

    var minutes = parseInt($("fDuration").value, 10);
    if (isNaN(minutes) || minutes < 0) minutes = 0;
    if (minutes > 600) minutes = 600;

    var list = entries.slice();
    var found = false;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === editingId) {
        list[i] = {
          id: list[i].id,
          start: start,
          minutes: minutes,
          side: editorSide,
          notes: $("fNotes").value.trim()
        };
        found = true;
        break;
      }
    }
    if (!found) {
      list.push({
        id: newId(),
        start: start,
        minutes: minutes,
        side: editorSide,
        notes: $("fNotes").value.trim()
      });
    }

    saveEntries(list);
    closeEditor();
    renderAll();
    toast("Saved");
  });

  $("editorDelete").addEventListener("click", function () {
    if (!editingId) return;
    if (!confirm("Delete this feeding?")) return;
    var id = editingId;
    saveEntries(entries.filter(function (e) { return e.id !== id; }));
    closeEditor();
    renderAll();
    toast("Deleted");
  });

  /* ---------------- menu, export, import ---------------- */

  $("menuBtn").addEventListener("click", function () { $("menuScrim").hidden = false; });
  $("menuClose").addEventListener("click", function () { $("menuScrim").hidden = true; });

  [$("editorScrim"), $("menuScrim")].forEach(function (scrim) {
    scrim.addEventListener("click", function (ev) {
      if (ev.target === scrim) scrim.hidden = true;
    });
  });

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function stamp() {
    var d = new Date();
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  }

  function csvCell(value) {
    var s = String(value == null ? "" : value);
    return '"' + s.replace(/"/g, '""') + '"';
  }

  $("exportCsv").addEventListener("click", function () {
    if (!entries.length) { toast("Nothing to export yet"); return; }
    var rows = [["Date", "Start time", "Minutes", "Side", "Notes"]];
    entries.slice().reverse().forEach(function (e) {
      var d = new Date(e.start);
      rows.push([
        d.toLocaleDateString(),
        d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
        e.minutes,
        SIDE_NAME[e.side],
        e.notes
      ]);
    });
    var csv = rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
    download("nursing-log-" + stamp() + ".csv", csv, "text/csv");
    $("menuScrim").hidden = true;
  });

  $("exportJson").addEventListener("click", function () {
    var payload = { app: "nursing-log", version: 1, exported: new Date().toISOString(), entries: entries };
    download("nursing-log-backup-" + stamp() + ".json", JSON.stringify(payload, null, 2), "application/json");
    $("menuScrim").hidden = true;
  });

  $("importJson").addEventListener("click", function () { $("fileInput").click(); });

  $("fileInput").addEventListener("change", function () {
    var file = this.files && this.files[0];
    this.value = "";
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try {
        var data = JSON.parse(reader.result);
        incoming = Array.isArray(data) ? data : data.entries;
      } catch (err) {
        toast("That file isn't a Nursing Log backup");
        return;
      }
      if (!Array.isArray(incoming)) { toast("That file isn't a Nursing Log backup"); return; }

      var seen = {};
      entries.forEach(function (e) { seen[e.start + "|" + e.side + "|" + e.minutes] = true; });

      var list = entries.slice();
      var added = 0;
      incoming.forEach(function (e) {
        if (!e || typeof e.start !== "number" || !SIDE_NAME[e.side]) return;
        var key = e.start + "|" + e.side + "|" + e.minutes;
        if (seen[key]) return;
        seen[key] = true;
        list.push({
          id: e.id || newId(),
          start: e.start,
          minutes: typeof e.minutes === "number" ? e.minutes : 0,
          side: e.side,
          notes: typeof e.notes === "string" ? e.notes : ""
        });
        added++;
      });

      saveEntries(list);
      renderAll();
      $("menuScrim").hidden = true;
      toast(added ? "Restored " + added + " feedings" : "Nothing new to add");
    };
    reader.readAsText(file);
  });

  $("aboutBtn").addEventListener("click", function () {
    alert(
      "Nursing Log\n\n" +
      "Everything you record is stored only on this phone, in this browser. " +
      "Nothing is sent anywhere and no account is needed.\n\n" +
      "Because of that, use \"Save backup file\" now and then. " +
      "Clearing the browser's site data would erase the log."
    );
  });

  /* ---------------- keep it live ---------------- */

  setInterval(function () {
    if (active) tick();
    else renderTimer();
  }, 1000);

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      entries = loadEntries();
      active = loadActive();
      renderAll();
    }
  });

  renderAll();

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline support is optional */ });
    });
  }
})();
</script>
</body>
</html>
