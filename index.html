<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nursing Log</title>
<meta name="description" content="A simple, private breastfeeding and diaper tracker.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8d5b74">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #fdf7f9;
    --surface: #ffffff;
    --surface-2: #f6eef2;
    --line: #e8d9e1;
    --text: #2e2429;
    --muted: #7c6a73;
    --accent: #8d5b74;
    --accent-soft: #f3e3ea;
    --left: #4f7cac;
    --right: #b2705a;
    --both: #6f8f6a;
    --pee: #c99a2e;
    --poop: #8a6a4f;
    --danger: #b3261e;
    --radius: 18px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171316;
      --surface: #211c1f;
      --surface-2: #2b2429;
      --line: #3a3136;
      --text: #f0e7ec;
      --muted: #a9989f;
      --accent: #e0aac4;
      --accent-soft: #3a2c34;
      --left: #8fb4dd;
      --right: #e2a48e;
      --both: #a3c69c;
      --pee: #e8c56a;
      --poop: #c0a184;
      --danger: #f2b8b5;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Layout classes below set `display`, which would otherwise beat the browser's
     own [hidden] rule and leave hidden panels on screen. */
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    padding-bottom: calc(28px + var(--safe-bottom));
    overscroll-behavior-y: contain;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 18px 0 12px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    width: 44px; height: 44px; border-radius: 50%; font-size: 20px;
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { background: var(--surface-2); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  }

  .since { text-align: center; color: var(--muted); font-size: 15px; }
  .since b { color: var(--text); font-weight: 600; }
  .elapsed {
    text-align: center; font-size: 52px; font-weight: 300; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; margin: 4px 0 2px;
  }
  .prompt { text-align: center; color: var(--muted); font-size: 14px; margin: 14px 0 10px; }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  .side-btn {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    border-radius: 14px; padding: 16px 6px; font-size: 17px; font-weight: 600;
    cursor: pointer; display: grid; gap: 3px; place-items: center; font-family: inherit;
  }
  .side-btn small { font-weight: 400; font-size: 12px; color: var(--muted); }
  .side-btn:active { transform: scale(0.98); }
  .side-btn.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .side-btn.sel small { color: var(--accent); }

  /* live per-side tiles while feeding */
  .side-tile {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    border-radius: 14px; padding: 12px 8px; cursor: pointer; font-family: inherit;
    display: grid; gap: 2px; place-items: center;
  }
  .side-tile .lbl { font-size: 13px; color: var(--muted); }
  .side-tile .val { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .side-tile.active {
    background: var(--accent-soft); border-color: var(--accent);
  }
  .side-tile.active .lbl { color: var(--accent); }
  .side-tile.active .val { color: var(--accent); }
  .side-tile .dot { font-size: 11px; color: var(--accent); height: 14px; }

  .big-btn {
    width: 100%; border: none; border-radius: 14px; padding: 18px;
    font-size: 18px; font-weight: 700; cursor: pointer; font-family: inherit;
    background: var(--accent); color: #fff; margin-top: 12px;
  }
  @media (prefers-color-scheme: dark) { .big-btn { color: #2a1b23; } }
  .big-btn:active { filter: brightness(0.95); }
  .text-btn {
    width: 100%; background: none; border: none; color: var(--muted);
    font-size: 15px; padding: 12px; margin-top: 4px; cursor: pointer; font-family: inherit;
  }

  .filter { padding: 10px 6px; font-size: 15px; }
  #filterRow { margin-top: 4px; }

  .card-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin-bottom: 10px; text-align: center;
  }

  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; }
  .stats div + div { border-left: 1px solid var(--line); }
  .stats .n { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stats .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  h2.day {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 22px 0 8px; display: flex; justify-content: space-between;
    gap: 10px; align-items: baseline;
  }
  h2.day span { text-transform: none; letter-spacing: 0; font-weight: 400; text-align: right; }

  .entry {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px; cursor: pointer; color: var(--text);
    font-family: inherit; font-size: 16px;
  }
  .entry:active { background: var(--surface-2); }
  .pill {
    flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: 15px; color: #fff;
  }
  @media (prefers-color-scheme: dark) { .pill { color: #1d1418; } }
  .pill.L { background: var(--left); }
  .pill.R { background: var(--right); }
  .pill.B { background: var(--both); }
  .pill.pee { background: var(--pee); font-size: 18px; }
  .pill.poop { background: var(--poop); font-size: 18px; }
  .pill.both-d { background: var(--poop); font-size: 13px; }
  .entry .meta { flex: 1; min-width: 0; }
  .entry .time { font-weight: 600; }
  .entry .sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 15px; }

  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .sheet {
    background: var(--bg); width: 100%; max-width: 560px;
    border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + var(--safe-bottom));
    max-height: 92vh; overflow-y: auto;
  }
  .sheet h3 { margin: 0 0 16px; font-size: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input[type="date"], input[type="time"], input[type="number"], textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 13px 12px;
  }
  textarea { resize: vertical; min-height: 76px; }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .btn {
    border-radius: 13px; padding: 15px; font-size: 16px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font-family: inherit;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #2a1b23; } }
  .btn.danger { color: var(--danger); }
  .btn.wide { grid-column: 1 / -1; }

  /* A sheet opened to read a record wears .locked: same card layout, nothing live. */
  .sheet.locked .side-btn { pointer-events: none; }
  .sheet.locked .side-btn:not(.sel) { opacity: 0.4; }
  .sheet.locked input, .sheet.locked textarea {
    background: var(--surface-2); border-color: var(--surface-2);
  }
  input:disabled, textarea:disabled {
    color: var(--text); opacity: 1; -webkit-text-fill-color: var(--text);
  }

  .menu-item {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: var(--text); font: inherit; padding: 16px 8px; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .menu-item:last-of-type { border-bottom: none; }
  .menu-item small { display: block; color: var(--muted); font-size: 13px; }

  /* While a feed runs the screen is held awake, so it goes dark on its own
     instead — bright enough to read the clock, dim enough for a dark nursery. */
  .veil {
    position: fixed; inset: 0; background: #000; z-index: 45;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; cursor: pointer;
  }
  .veil-time { font-size: 60px; font-weight: 200; font-variant-numeric: tabular-nums; color: #5f5f5f; }
  .veil-side { font-size: 16px; color: #454545; }
  .veil-hint { position: absolute; bottom: calc(44px + var(--safe-bottom)); font-size: 13px; color: #2f2f2f; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + var(--safe-bottom)); background: var(--text); color: var(--bg);
    padding: 12px 16px; border-radius: 30px; font-size: 15px; z-index: 100;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25); max-width: 92vw;
    display: flex; align-items: center; gap: 14px;
  }
  .toast button {
    background: none; border: none; color: var(--bg); font: inherit; font-weight: 700;
    text-decoration: underline; cursor: pointer; padding: 0; flex: none;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Nursing Log</h1>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">&#9881;</button>
  </header>

  <!-- Feeding -->
  <section class="card">
    <div id="idleView">
      <div class="since" id="sinceText">No feedings recorded yet</div>
      <div class="prompt">Start a feeding</div>
      <div class="row-2">
        <button class="side-btn" data-start="L">Left<small>start here</small></button>
        <button class="side-btn" data-start="R">Right<small>start here</small></button>
      </div>
      <button class="text-btn" id="addManualBtn">+ Add a past feeding</button>
    </div>

    <div id="runningView" hidden>
      <div class="since">Feeding since <b id="startedAt">&mdash;</b></div>
      <div class="elapsed" id="elapsed">0:00</div>
      <div class="prompt" style="margin-top:0">Tap the other side to switch</div>
      <div class="row-2">
        <button class="side-tile" data-switch="L">
          <div class="lbl">Left</div>
          <div class="val" id="leftVal">0:00</div>
          <div class="dot" id="leftDot"></div>
        </button>
        <button class="side-tile" data-switch="R">
          <div class="lbl">Right</div>
          <div class="val" id="rightVal">0:00</div>
          <div class="dot" id="rightDot"></div>
        </button>
      </div>
      <button class="big-btn" id="stopBtn">Stop &amp; Save</button>
      <button class="text-btn" id="cancelBtn">Cancel without saving</button>
    </div>
  </section>

  <!-- Diapers -->
  <section class="card">
    <div class="since" id="diaperSince">No diapers recorded yet</div>
    <div class="prompt">Log a diaper</div>
    <div class="row-3">
      <button class="side-btn" data-diaper="pee">&#128167;<small>Pee</small></button>
      <button class="side-btn" data-diaper="poop">&#128169;<small>Poop</small></button>
      <button class="side-btn" data-diaper="both">&#128167;&#128169;<small>Both</small></button>
    </div>
    <button class="text-btn" id="addDiaperBtn">+ Add a past diaper</button>
  </section>

  <!-- Today -->
  <section class="card stats">
    <div><div class="n" id="statCount">0</div><div class="l">Feeds today</div></div>
    <div><div class="n" id="statMinutes">0</div><div class="l">Minutes</div></div>
    <div><div class="n" id="statDiapers">0</div><div class="l">Diapers</div></div>
  </section>

  <div class="row-3" id="filterRow">
    <button class="side-btn filter" data-filter="all">All</button>
    <button class="side-btn filter" data-filter="feeds">Feeds</button>
    <button class="side-btn filter" data-filter="diapers">Diapers</button>
  </div>

  <div id="history"></div>

</div>

<!-- Feeding editor -->
<div class="scrim" id="editorScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="editorTitle">Edit feeding</h3>

    <label>Which side</label>
    <div class="row-3">
      <button class="side-btn" data-pick="L">L<small>Left</small></button>
      <button class="side-btn" data-pick="R">R<small>Right</small></button>
      <button class="side-btn" data-pick="B">B<small>Both</small></button>
    </div>

    <div class="row-2">
      <div><label for="fDate">Date</label><input type="date" id="fDate"></div>
      <div><label for="fTime">Start time</label><input type="time" id="fTime"></div>
    </div>

    <div id="durSingle">
      <label for="fDur" id="durLabel">Minutes on this side</label>
      <input type="number" id="fDur" min="0" max="600" inputmode="numeric" step="1">
    </div>

    <div id="durSplit" class="row-2" hidden>
      <div><label for="fLeft">Minutes on left</label><input type="number" id="fLeft" min="0" max="600" inputmode="numeric" step="1"></div>
      <div><label for="fRight">Minutes on right</label><input type="number" id="fRight" min="0" max="600" inputmode="numeric" step="1"></div>
    </div>

    <div id="endWrap" hidden>
      <label>Ended on</label>
      <div class="row-2">
        <button class="side-btn" data-end="L">Left</button>
        <button class="side-btn" data-end="R">Right</button>
      </div>
    </div>

    <div id="fNotesWrap">
      <label for="fNotes">Notes</label>
      <textarea id="fNotes" placeholder="Fussy, spit up, fell asleep, vitamin D&hellip;"></textarea>
    </div>

    <div class="sheet-actions">
      <button class="btn" id="editorClose" hidden>Close</button>
      <button class="btn primary" id="editorEdit" hidden>Edit</button>
      <button class="btn" id="editorCancel">Cancel</button>
      <button class="btn primary" id="editorSave">Save</button>
      <button class="btn danger wide" id="editorDelete" hidden>Delete this feeding</button>
    </div>
  </div>
</div>

<!-- Diaper editor -->
<div class="scrim" id="diaperScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="diaperTitle">Edit diaper</h3>

    <label>What was in it</label>
    <div class="row-2">
      <button class="side-btn" data-toggle="pee">&#128167;<small>Pee</small></button>
      <button class="side-btn" data-toggle="poop">&#128169;<small>Poop</small></button>
    </div>

    <div id="sizeWrap" hidden>
      <label>How big</label>
      <div class="row-3">
        <button class="side-btn" data-size="S">Small</button>
        <button class="side-btn" data-size="M">Medium</button>
        <button class="side-btn" data-size="L">Large</button>
      </div>
    </div>

    <div class="row-2">
      <div><label for="dDate">Date</label><input type="date" id="dDate"></div>
      <div><label for="dTime">Time</label><input type="time" id="dTime"></div>
    </div>

    <div id="dNotesWrap">
      <label for="dNotes">Notes</label>
      <textarea id="dNotes" placeholder="Color, rash, leaked&hellip;"></textarea>
    </div>

    <div class="sheet-actions">
      <button class="btn" id="diaperClose" hidden>Close</button>
      <button class="btn primary" id="diaperEdit" hidden>Edit</button>
      <button class="btn" id="diaperCancel">Cancel</button>
      <button class="btn primary" id="diaperSave">Save</button>
      <button class="btn danger wide" id="diaperDelete" hidden>Delete this diaper</button>
    </div>
  </div>
</div>

<!-- Menu -->
<div class="scrim" id="menuScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h3>Data &amp; backup</h3>
    <button class="menu-item" id="exportCsv">Export spreadsheet (CSV)<small>Feedings and diapers, for Excel or Google Sheets</small></button>
    <button class="menu-item" id="exportJson">Save backup file<small>Everything, so you can restore it later</small></button>
    <button class="menu-item" id="importJson">Restore from backup<small>Adds anything missing from a backup file</small></button>
    <button class="menu-item" id="aboutBtn">About this app<small>Where your data lives</small></button>
    <div class="sheet-actions">
      <button class="btn wide" id="menuClose">Close</button>
    </div>
    <input type="file" id="fileInput" accept="application/json,.json" hidden>
  </div>
</div>

<div class="veil" id="dimVeil" hidden>
  <div class="veil-time" id="veilTime">0:00</div>
  <div class="veil-side" id="veilSide"></div>
  <div class="veil-hint">Tap to wake</div>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastAction" hidden>Undo</button></div>

<script>
(function () {
  "use strict";

  var FEEDS_KEY = "nursinglog.entries.v1";
  var DIAPERS_KEY = "nursinglog.diapers.v1";
  var ACTIVE_KEY = "nursinglog.active.v1";
  var FILTER_KEY = "nursinglog.filter.v1";
  var SIDE_NAME = { L: "Left", R: "Right", B: "Both" };

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- model ---------------- */

  /* A feeding is { id, start, leftSec, rightSec, endSide, notes }.
     Older versions stored { minutes, side }, so migrate those on the way in. */
  function normalizeFeed(e) {
    if (!e || typeof e.start !== "number") return null;

    var leftSec, rightSec;
    if (typeof e.leftSec === "number" || typeof e.rightSec === "number") {
      leftSec = Math.max(0, e.leftSec || 0);
      rightSec = Math.max(0, e.rightSec || 0);
    } else {
      var secs = Math.max(0, (typeof e.minutes === "number" ? e.minutes : 0) * 60);
      if (e.side === "R") { leftSec = 0; rightSec = secs; }
      else if (e.side === "B") { leftSec = Math.round(secs / 2); rightSec = secs - Math.round(secs / 2); }
      else { leftSec = secs; rightSec = 0; }
    }

    /* Which breast the feeding finished on. Only ever a side that has time on
       it, so stopping right after a switch can't leave it pointing nowhere. */
    var endSide = e.endSide === "L" || e.endSide === "R" ? e.endSide : null;
    if (endSide === "L" && leftSec === 0) endSide = null;
    if (endSide === "R" && rightSec === 0) endSide = null;
    if (!endSide) {
      if (leftSec > 0 && rightSec === 0) endSide = "L";
      else if (rightSec > 0 && leftSec === 0) endSide = "R";
    }

    return {
      id: e.id || newId(),
      start: e.start,
      leftSec: leftSec,
      rightSec: rightSec,
      endSide: endSide,
      notes: typeof e.notes === "string" ? e.notes : ""
    };
  }

  var SIZE_NAME = { S: "Small", M: "Medium", L: "Large" };

  function normalizeDiaper(d) {
    if (!d || typeof d.time !== "number") return null;
    if (!d.pee && !d.poop) return null;
    return {
      id: d.id || newId(),
      time: d.time,
      pee: !!d.pee,
      poop: !!d.poop,
      /* Size describes the poop, so it only rides along when there is one. */
      size: d.poop && SIZE_NAME[d.size] ? d.size : null,
      notes: typeof d.notes === "string" ? d.notes : ""
    };
  }

  function feedSide(e) {
    if (e.leftSec > 0 && e.rightSec > 0) return "B";
    if (e.rightSec > 0) return "R";
    return "L";
  }

  function minutesOf(sec) {
    if (sec <= 0) return 0;
    return Math.max(1, Math.round(sec / 60));
  }

  /* Total is the sum of what each side displays, so the numbers always add up. */
  function feedMinutes(e) {
    if (e.leftSec > 0 && e.rightSec > 0) return minutesOf(e.leftSec) + minutesOf(e.rightSec);
    return minutesOf(e.leftSec + e.rightSec);
  }

  function diaperLabel(d) {
    if (d.pee && d.poop) return "Pee + poop";
    return d.poop ? "Poop" : "Pee";
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ---------------- storage ---------------- */

  function readList(key, normalize) {
    try {
      var raw = localStorage.getItem(key);
      var list = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(list)) return [];
      var out = [];
      for (var i = 0; i < list.length; i++) {
        var item = normalize(list[i]);
        if (item) out.push(item);
      }
      return out;
    } catch (err) {
      return [];
    }
  }

  function writeList(key, list) {
    try {
      localStorage.setItem(key, JSON.stringify(list));
    } catch (err) {
      toast("Could not save — phone storage may be full");
    }
  }

  function loadFeeds() { return readList(FEEDS_KEY, normalizeFeed); }
  function loadDiapers() { return readList(DIAPERS_KEY, normalizeDiaper); }

  function saveFeeds(list) {
    list.sort(function (a, b) { return b.start - a.start; });
    feeds = list;
    writeList(FEEDS_KEY, list);
  }

  function saveDiapers(list) {
    list.sort(function (a, b) { return b.time - a.time; });
    diapers = list;
    writeList(DIAPERS_KEY, list);
  }

  /* Active session: { start, side, leftSec, rightSec, segStart }.
     leftSec/rightSec hold finished stretches; segStart is when the current side began. */
  function loadActive() {
    try {
      var a = JSON.parse(localStorage.getItem(ACTIVE_KEY) || "null");
      if (a && typeof a.start === "number" && SIDE_NAME[a.side]) {
        return {
          start: a.start,
          side: a.side === "B" ? "L" : a.side,
          leftSec: a.leftSec || 0,
          rightSec: a.rightSec || 0,
          segStart: typeof a.segStart === "number" ? a.segStart : a.start
        };
      }
    } catch (err) { /* ignore */ }
    return null;
  }

  function setActive(a) {
    active = a;
    if (a) localStorage.setItem(ACTIVE_KEY, JSON.stringify(a));
    else localStorage.removeItem(ACTIVE_KEY);
  }

  var feeds = loadFeeds();
  var diapers = loadDiapers();
  var active = loadActive();
  var filter = localStorage.getItem(FILTER_KEY) || "all";
  if (filter !== "feeds" && filter !== "diapers") filter = "all";

  /* ---------------- formatting ---------------- */

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function clockTime(ms) {
    return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function stopwatch(seconds) {
    var m = Math.floor(seconds / 60), s = seconds % 60;
    if (m >= 60) return Math.floor(m / 60) + ":" + pad(m % 60) + ":" + pad(s);
    return m + ":" + pad(s);
  }

  function durationText(minutes) {
    if (minutes < 1) return "less than a minute";
    if (minutes < 60) return minutes + " min";
    var h = Math.floor(minutes / 60), m = minutes % 60;
    return m ? h + "h " + m + "m" : h + "h";
  }

  function agoText(ms) {
    var mins = Math.floor((Date.now() - ms) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + " min ago";
    var h = Math.floor(mins / 60), m = mins % 60;
    return (m ? h + "h " + m + "m" : h + "h") + " ago";
  }

  function dayKey(ms) {
    var d = new Date(ms);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function dayLabel(key) {
    if (key === dayKey(Date.now())) return "Today";
    if (key === dayKey(Date.now() - 86400000)) return "Yesterday";
    var p = key.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2])
      .toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  }

  var toastTimer = null;
  function toast(msg, undoFn) {
    var box = $("toast"), action = $("toastAction");
    $("toastText").textContent = msg;
    action.hidden = !undoFn;
    action.onclick = undoFn ? function () {
      box.hidden = true;
      undoFn();
    } : null;
    box.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.hidden = true; }, undoFn ? 6000 : 2600);
  }

  /* ---------------- timer maths ---------------- */

  function segSeconds() {
    if (!active) return 0;
    return Math.max(0, Math.floor((Date.now() - active.segStart) / 1000));
  }

  function liveLeft() { return active.leftSec + (active.side === "L" ? segSeconds() : 0); }
  function liveRight() { return active.rightSec + (active.side === "R" ? segSeconds() : 0); }

  /* ---------------- rendering ---------------- */

  function markSelected(root, attr, value) {
    var btns = root.querySelectorAll("[" + attr + "]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle("sel", btns[i].getAttribute(attr) === value);
    }
  }

  function renderFeedCard() {
    if (active) {
      $("idleView").hidden = true;
      $("runningView").hidden = false;
      $("startedAt").textContent = clockTime(active.start);
      tick();
    } else {
      $("idleView").hidden = false;
      $("runningView").hidden = true;
      var last = feeds[0];
      $("sinceText").innerHTML = last
        ? "Last fed <b>" + agoText(last.start) + "</b> &middot; " + lastSideText(last)
        : "No feedings recorded yet";
    }
  }

  /* On the idle card, the side she finished on is the useful one — it says
     where to pick up next. */
  function lastSideText(e) {
    if (e.endSide) return "ended on " + SIDE_NAME[e.endSide].toLowerCase();
    return SIDE_NAME[feedSide(e)];
  }

  function tick() {
    if (!active) return;
    var l = liveLeft(), r = liveRight();
    $("elapsed").textContent = stopwatch(l + r);
    $("leftVal").textContent = stopwatch(l);
    $("rightVal").textContent = stopwatch(r);
    $("leftDot").textContent = active.side === "L" ? "● feeding" : "";
    $("rightDot").textContent = active.side === "R" ? "● feeding" : "";
    var tiles = document.querySelectorAll("[data-switch]");
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].classList.toggle("active", tiles[i].getAttribute("data-switch") === active.side);
    }
  }

  function renderDiaperCard() {
    var last = diapers[0];
    $("diaperSince").innerHTML = last
      ? "Last diaper <b>" + agoText(last.time) + "</b> &middot; " + diaperLabel(last)
      : "No diapers recorded yet";
  }

  function renderStats() {
    var today = dayKey(Date.now());
    var count = 0, minutes = 0, dcount = 0;

    feeds.forEach(function (e) {
      if (dayKey(e.start) === today) { count++; minutes += feedMinutes(e); }
    });
    diapers.forEach(function (d) {
      if (dayKey(d.time) === today) dcount++;
    });

    $("statCount").textContent = count;
    $("statMinutes").textContent = minutes;
    $("statDiapers").textContent = dcount;
  }

  function feedSubText(e) {
    if (e.leftSec > 0 && e.rightSec > 0) {
      var text = "Left " + minutesOf(e.leftSec) + " min · Right " + minutesOf(e.rightSec) + " min";
      if (e.endSide) text += " · ended " + SIDE_NAME[e.endSide].toLowerCase();
      return text;
    }
    return SIDE_NAME[feedSide(e)] + " only";
  }

  function renderHistory() {
    var host = $("history");
    host.textContent = "";

    var items = [];
    if (filter !== "diapers") {
      feeds.forEach(function (e) { items.push({ kind: "feed", at: e.start, data: e }); });
    }
    if (filter !== "feeds") {
      diapers.forEach(function (d) { items.push({ kind: "diaper", at: d.time, data: d }); });
    }
    items.sort(function (a, b) { return b.at - a.at; });

    markSelected($("filterRow"), "data-filter", filter);

    if (!items.length) {
      var p = document.createElement("div");
      p.className = "empty";
      p.textContent = filter === "feeds" ? "No feedings recorded yet."
        : filter === "diapers" ? "No diapers recorded yet."
        : "Feedings and diapers you record will show up here.";
      host.appendChild(p);
      return;
    }

    var currentDay = null;

    items.forEach(function (item) {
      var key = dayKey(item.at);

      if (key !== currentDay) {
        currentDay = key;

        var fCount = 0, fMin = 0, dCount = 0;
        items.forEach(function (x) {
          if (dayKey(x.at) !== key) return;
          if (x.kind === "feed") { fCount++; fMin += feedMinutes(x.data); }
          else dCount++;
        });

        var h = document.createElement("h2");
        h.className = "day";
        var name = document.createElement("strong");
        name.textContent = dayLabel(key);
        var sum = document.createElement("span");
        var parts = [];
        if (fCount) parts.push(fCount + (fCount === 1 ? " feed" : " feeds") + " · " + fMin + " min");
        if (dCount) parts.push(dCount + (dCount === 1 ? " diaper" : " diapers"));
        sum.textContent = parts.join(" · ");
        h.appendChild(name);
        h.appendChild(sum);
        host.appendChild(h);
      }

      var row = document.createElement("button");
      row.className = "entry";
      row.type = "button";

      var pill = document.createElement("div");
      var meta = document.createElement("div");
      meta.className = "meta";
      var line1 = document.createElement("div");
      line1.className = "time";
      var line2 = document.createElement("div");
      line2.className = "sub";

      if (item.kind === "feed") {
        var e = item.data;
        pill.className = "pill " + feedSide(e);
        pill.textContent = feedSide(e);
        line1.textContent = clockTime(e.start) + " · " + durationText(feedMinutes(e));
        line2.textContent = feedSubText(e);
        row.addEventListener("click", function () { openFeedEditor(e.id, true); });
      } else {
        var d = item.data;
        pill.className = "pill " + (d.pee && d.poop ? "both-d" : d.poop ? "poop" : "pee");
        pill.textContent = d.pee && d.poop ? "💧💩" : d.poop ? "💩" : "💧";
        line1.textContent = clockTime(d.time) + " · " + diaperLabel(d);
        line2.textContent = d.size ? SIZE_NAME[d.size] + " poop" : "Diaper";
        row.addEventListener("click", function () { openDiaperEditor(d.id, null, true); });
      }

      var notes = item.data.notes;
      meta.appendChild(line1);
      meta.appendChild(line2);
      if (notes) {
        var line3 = document.createElement("div");
        line3.className = "sub";
        line3.textContent = notes;
        meta.appendChild(line3);
      }

      row.appendChild(pill);
      row.appendChild(meta);
      host.appendChild(row);
    });
  }

  function renderAll() {
    renderFeedCard();
    renderDiaperCard();
    renderStats();
    renderHistory();
  }

  /* ---------------- timer actions ---------------- */

  document.querySelectorAll("[data-start]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var now = Date.now();
      setActive({
        start: now,
        side: btn.getAttribute("data-start"),
        leftSec: 0,
        rightSec: 0,
        segStart: now
      });
      renderAll();
      wakeScreen();
    });
  });

  document.querySelectorAll("[data-switch]").forEach(function (tile) {
    tile.addEventListener("click", function () {
      if (!active) return;
      var next = tile.getAttribute("data-switch");
      if (next === active.side) return;

      var elapsed = segSeconds();
      var updated = {
        start: active.start,
        side: next,
        leftSec: active.leftSec + (active.side === "L" ? elapsed : 0),
        rightSec: active.rightSec + (active.side === "R" ? elapsed : 0),
        segStart: Date.now()
      };
      setActive(updated);
      tick();
    });
  });

  $("stopBtn").addEventListener("click", function () {
    if (!active) return;

    var entry = {
      id: newId(),
      start: active.start,
      leftSec: liveLeft(),
      rightSec: liveRight(),
      endSide: active.side,
      notes: ""
    };
    if (entry.leftSec + entry.rightSec < 1) { entry.leftSec = active.side === "L" ? 1 : 0; entry.rightSec = active.side === "R" ? 1 : 0; }

    var list = feeds.slice();
    list.push(entry);
    saveFeeds(list);
    setActive(null);
    renderAll();
    wakeScreen();
    toast("Saved " + durationText(feedMinutes(entry)) + " · " + SIDE_NAME[feedSide(entry)]);
  });

  $("cancelBtn").addEventListener("click", function () {
    if (confirm("Discard this feeding without saving?")) {
      setActive(null);
      renderAll();
      wakeScreen();
    }
  });

  /* ---------------- read-only mode ---------------- */

  /* Reading a record shows the same card as editing it, with every control
     inert, so nothing can be nudged while looking. Edit unlocks it in place. */
  function setLocked(scrimId, on, opts) {
    var sheet = $(scrimId).querySelector(".sheet");
    sheet.classList.toggle("locked", on);

    var fields = sheet.querySelectorAll("input, textarea");
    for (var i = 0; i < fields.length; i++) fields[i].disabled = on;

    $(opts.close).hidden = !on;
    $(opts.edit).hidden = !on;
    $(opts.cancel).hidden = on;
    $(opts.save).hidden = on;
    $(opts.del).hidden = on || !opts.existing;

    /* Empty boxes say nothing when you are only reading. */
    $(opts.notes).hidden = on && !$(opts.notesField).value;
  }

  function findById(list, key, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i][key] === id) return list[i];
    }
    return null;
  }

  /* ---------------- feeding editor ---------------- */

  var editingFeedId = null;
  var editorSide = "L";
  var editorEnd = "R";
  var feedBaseMs = 0, feedBaseKey = "";

  function applySideLayout() {
    var single = editorSide !== "B";
    $("durSingle").hidden = !single;
    $("durSplit").hidden = single;
    var reading = $("editorScrim").querySelector(".sheet").classList.contains("locked");
    $("endWrap").hidden = single || (reading && !editorEnd);
    $("durLabel").textContent = "Minutes on the " + (editorSide === "R" ? "right" : "left");
    markSelected($("editorScrim"), "data-pick", editorSide);
    markSelected($("endWrap"), "data-end", editorEnd);
  }

  function lockFeed(on) {
    setLocked("editorScrim", on, {
      close: "editorClose", edit: "editorEdit", cancel: "editorCancel",
      save: "editorSave", del: "editorDelete",
      notes: "fNotesWrap", notesField: "fNotes", existing: !!editingFeedId
    });
    applySideLayout();
  }

  function openFeedEditor(id, locked) {
    var e = findById(feeds, "id", id);

    editingFeedId = e ? e.id : null;
    editorSide = e ? feedSide(e) : "L";
    editorEnd = (e && e.endSide) || "R";

    $("editorTitle").textContent = !e ? "Add a feeding"
      : locked ? "Feeding · " + SIDE_NAME[feedSide(e)]
      : "Edit feeding";
    feedBaseMs = e ? e.start : Date.now();
    feedBaseKey = fillDateTime("fDate", "fTime", feedBaseMs);
    $("fLeft").value = e ? minutesOf(e.leftSec) : 0;
    $("fRight").value = e ? minutesOf(e.rightSec) : 0;
    $("fDur").value = e ? minutesOf(e.leftSec + e.rightSec) : 15;
    $("fNotes").value = e ? e.notes : "";

    lockFeed(!!locked);
    $("editorScrim").hidden = false;
  }

  $("editorClose").addEventListener("click", function () { $("editorScrim").hidden = true; });

  $("editorEdit").addEventListener("click", function () {
    $("editorTitle").textContent = "Edit feeding";
    lockFeed(false);
  });

  function num(id) {
    var v = parseInt($(id).value, 10);
    if (isNaN(v) || v < 0) v = 0;
    return Math.min(v, 600);
  }

  document.querySelectorAll("[data-end]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      editorEnd = btn.getAttribute("data-end");
      markSelected($("endWrap"), "data-end", editorEnd);
    });
  });

  document.querySelectorAll("[data-pick]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var next = btn.getAttribute("data-pick");
      if (next === editorSide) return;

      /* Carry the minutes across so switching sides never loses what was typed. */
      if (next === "B") {
        var single = num("fDur");
        $("fLeft").value = editorSide === "L" ? single : 0;
        $("fRight").value = editorSide === "R" ? single : 0;
      } else if (editorSide === "B") {
        $("fDur").value = num("fLeft") + num("fRight");
      }

      editorSide = next;
      applySideLayout();
    });
  });

  $("addManualBtn").addEventListener("click", function () { openFeedEditor(null, false); });
  $("editorCancel").addEventListener("click", function () { $("editorScrim").hidden = true; });

  /* The date and time inputs only carry minutes. Remember the exact instant a
     sheet was opened with, and keep it when those fields are left untouched, so
     logging or editing never quietly shifts a record by up to 59 seconds. */
  function fieldsKey(dateId, timeId) {
    return $(dateId).value + "|" + $(timeId).value;
  }

  function fillDateTime(dateId, timeId, ms) {
    var d = new Date(ms);
    $(dateId).value = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    $(timeId).value = pad(d.getHours()) + ":" + pad(d.getMinutes());
    return fieldsKey(dateId, timeId);
  }

  function readDateTime(dateId, timeId) {
    var dateVal = $(dateId).value, timeVal = $(timeId).value;
    if (!dateVal || !timeVal) return null;
    var dp = dateVal.split("-"), tp = timeVal.split(":");
    var ms = new Date(+dp[0], +dp[1] - 1, +dp[2], +tp[0], +tp[1], 0, 0).getTime();
    return isNaN(ms) ? null : ms;
  }

  $("editorSave").addEventListener("click", function () {
    var start = fieldsKey("fDate", "fTime") === feedBaseKey
      ? feedBaseMs
      : readDateTime("fDate", "fTime");
    if (start === null) { toast("Please set a date and time"); return; }

    var leftMin, rightMin;
    if (editorSide === "B") { leftMin = num("fLeft"); rightMin = num("fRight"); }
    else if (editorSide === "R") { leftMin = 0; rightMin = num("fDur"); }
    else { leftMin = num("fDur"); rightMin = 0; }

    if (editorSide === "B" && leftMin === 0 && rightMin === 0) {
      toast("Add minutes for at least one side");
      return;
    }

    var record = normalizeFeed({
      id: editingFeedId || newId(),
      start: start,
      leftSec: leftMin * 60,
      rightSec: rightMin * 60,
      endSide: editorSide === "B" ? editorEnd : editorSide,
      notes: $("fNotes").value.trim()
    });

    var list = feeds.filter(function (e) { return e.id !== editingFeedId; });
    list.push(record);
    saveFeeds(list);

    $("editorScrim").hidden = true;
    renderAll();
    toast("Saved");
  });

  /* Deleting is undoable rather than confirmed: a confirm at 3 a.m. gets tapped
     through on reflex, and this way the record is genuinely recoverable. */
  $("editorDelete").addEventListener("click", function () {
    var gone = findById(feeds, "id", editingFeedId);
    if (!gone) return;

    saveFeeds(feeds.filter(function (e) { return e.id !== gone.id; }));
    $("editorScrim").hidden = true;
    renderAll();

    toast("Feeding deleted", function () {
      var list = feeds.slice();
      list.push(gone);
      saveFeeds(list);
      renderAll();
      toast("Feeding restored");
    });
  });

  /* ---------------- diapers ---------------- */

  var editingDiaperId = null;
  var diaperSize = null;
  var diaperBaseMs = 0, diaperBaseKey = "";

  document.querySelectorAll("[data-diaper]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      openDiaperEditor(null, btn.getAttribute("data-diaper"), false);
    });
  });

  function syncSizeVisibility() {
    var sheet = $("diaperScrim").querySelector(".sheet");
    var poop = sheet.querySelector('[data-toggle="poop"]').classList.contains("sel");
    var reading = sheet.classList.contains("locked");
    if (!poop && !reading) { diaperSize = null; markSelected($("sizeWrap"), "data-size", null); }
    /* Reading a poop with no size recorded, the row would be three dimmed chips. */
    $("sizeWrap").hidden = !poop || (reading && !diaperSize);
  }

  function lockDiaper(on) {
    setLocked("diaperScrim", on, {
      close: "diaperClose", edit: "diaperEdit", cancel: "diaperCancel",
      save: "diaperSave", del: "diaperDelete",
      notes: "dNotesWrap", notesField: "dNotes", existing: !!editingDiaperId
    });
    syncSizeVisibility();
  }

  /* preset is "pee" / "poop" / "both" when coming from the quick buttons. */
  function openDiaperEditor(id, preset, locked) {
    var d = findById(diapers, "id", id);

    editingDiaperId = d ? d.id : null;

    $("diaperTitle").textContent = !d ? (preset ? "Log a diaper" : "Add a diaper")
      : locked ? "Diaper · " + diaperLabel(d)
      : "Edit diaper";
    diaperBaseMs = d ? d.time : Date.now();
    diaperBaseKey = fillDateTime("dDate", "dTime", diaperBaseMs);
    $("dNotes").value = d ? d.notes : "";

    var scrim = $("diaperScrim");
    var wantsPee = d ? d.pee : preset !== "poop";
    var wantsPoop = d ? d.poop : preset === "poop" || preset === "both";
    scrim.querySelector('[data-toggle="pee"]').classList.toggle("sel", wantsPee);
    scrim.querySelector('[data-toggle="poop"]').classList.toggle("sel", wantsPoop);

    diaperSize = d ? d.size : null;
    markSelected($("sizeWrap"), "data-size", diaperSize);

    lockDiaper(!!locked);
    scrim.hidden = false;
  }

  $("diaperClose").addEventListener("click", function () { $("diaperScrim").hidden = true; });

  $("diaperEdit").addEventListener("click", function () {
    $("diaperTitle").textContent = "Edit diaper";
    lockDiaper(false);
  });

  document.querySelectorAll("[data-toggle]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      btn.classList.toggle("sel");
      syncSizeVisibility();
    });
  });

  document.querySelectorAll("[data-size]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var next = btn.getAttribute("data-size");
      diaperSize = diaperSize === next ? null : next;   /* tap again to unset */
      markSelected($("sizeWrap"), "data-size", diaperSize);
    });
  });

  $("addDiaperBtn").addEventListener("click", function () { openDiaperEditor(null, null, false); });
  $("diaperCancel").addEventListener("click", function () { $("diaperScrim").hidden = true; });

  $("diaperSave").addEventListener("click", function () {
    var time = fieldsKey("dDate", "dTime") === diaperBaseKey
      ? diaperBaseMs
      : readDateTime("dDate", "dTime");
    if (time === null) { toast("Please set a date and time"); return; }

    var scrim = $("diaperScrim");
    var pee = scrim.querySelector('[data-toggle="pee"]').classList.contains("sel");
    var poop = scrim.querySelector('[data-toggle="poop"]').classList.contains("sel");
    if (!pee && !poop) { toast("Pick pee, poop, or both"); return; }

    var record = normalizeDiaper({
      id: editingDiaperId || newId(),
      time: time,
      pee: pee,
      poop: poop,
      size: diaperSize,
      notes: $("dNotes").value.trim()
    });

    var list = diapers.filter(function (d) { return d.id !== editingDiaperId; });
    list.push(record);
    saveDiapers(list);

    scrim.hidden = true;
    renderAll();
    toast("Saved");
  });

  $("diaperDelete").addEventListener("click", function () {
    var gone = findById(diapers, "id", editingDiaperId);
    if (!gone) return;

    saveDiapers(diapers.filter(function (d) { return d.id !== gone.id; }));
    $("diaperScrim").hidden = true;
    renderAll();

    toast("Diaper deleted", function () {
      var list = diapers.slice();
      list.push(gone);
      saveDiapers(list);
      renderAll();
      toast("Diaper restored");
    });
  });

  /* ---------------- menu, export, import ---------------- */

  document.querySelectorAll("[data-filter]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter");
      localStorage.setItem(FILTER_KEY, filter);
      renderHistory();
    });
  });

  $("menuBtn").addEventListener("click", function () { $("menuScrim").hidden = false; });
  $("menuClose").addEventListener("click", function () { $("menuScrim").hidden = true; });

  [$("editorScrim"), $("diaperScrim"), $("menuScrim")].forEach(function (scrim) {
    scrim.addEventListener("click", function (ev) {
      if (ev.target === scrim) scrim.hidden = true;
    });
  });

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function stamp() {
    var d = new Date();
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  }

  function csvCell(value) {
    return '"' + String(value == null ? "" : value).replace(/"/g, '""') + '"';
  }

  $("exportCsv").addEventListener("click", function () {
    if (!feeds.length && !diapers.length) { toast("Nothing to export yet"); return; }

    var rows = [["Date", "Time", "Type", "Side", "Left (min)", "Right (min)", "Total (min)", "Ended on", "Pee", "Poop", "Poop size", "Notes"]];

    var items = [];
    feeds.forEach(function (e) { items.push({ at: e.start, kind: "feed", data: e }); });
    diapers.forEach(function (d) { items.push({ at: d.time, kind: "diaper", data: d }); });
    items.sort(function (a, b) { return a.at - b.at; });

    items.forEach(function (item) {
      var when = new Date(item.at);
      var date = when.toLocaleDateString();
      var time = when.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

      if (item.kind === "feed") {
        var e = item.data;
        rows.push([date, time, "Feeding", SIDE_NAME[feedSide(e)],
          minutesOf(e.leftSec), minutesOf(e.rightSec), feedMinutes(e),
          e.endSide ? SIDE_NAME[e.endSide] : "", "", "", "", e.notes]);
      } else {
        var d = item.data;
        rows.push([date, time, "Diaper", "", "", "", "", "",
          d.pee ? "Yes" : "", d.poop ? "Yes" : "",
          d.size ? SIZE_NAME[d.size] : "", d.notes]);
      }
    });

    download("nursing-log-" + stamp() + ".csv",
      rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n"), "text/csv");
    $("menuScrim").hidden = true;
  });

  $("exportJson").addEventListener("click", function () {
    var payload = {
      app: "nursing-log",
      version: 2,
      exported: new Date().toISOString(),
      entries: feeds,
      diapers: diapers
    };
    download("nursing-log-backup-" + stamp() + ".json", JSON.stringify(payload, null, 2), "application/json");
    $("menuScrim").hidden = true;
  });

  $("importJson").addEventListener("click", function () { $("fileInput").click(); });

  $("fileInput").addEventListener("change", function () {
    var file = this.files && this.files[0];
    this.value = "";
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try {
        data = JSON.parse(reader.result);
      } catch (err) {
        toast("That file isn't a Nursing Log backup");
        return;
      }

      var inFeeds = Array.isArray(data) ? data : data.entries;
      var inDiapers = data.diapers;
      if (!Array.isArray(inFeeds) && !Array.isArray(inDiapers)) {
        toast("That file isn't a Nursing Log backup");
        return;
      }

      var added = 0;

      if (Array.isArray(inFeeds)) {
        var seenF = {};
        feeds.forEach(function (e) { seenF[e.start + "|" + e.leftSec + "|" + e.rightSec] = true; });
        var fList = feeds.slice();
        inFeeds.forEach(function (raw) {
          var e = normalizeFeed(raw);
          if (!e) return;
          var key = e.start + "|" + e.leftSec + "|" + e.rightSec;
          if (seenF[key]) return;
          seenF[key] = true;
          fList.push(e);
          added++;
        });
        saveFeeds(fList);
      }

      if (Array.isArray(inDiapers)) {
        var seenD = {};
        diapers.forEach(function (d) { seenD[d.time + "|" + d.pee + "|" + d.poop] = true; });
        var dList = diapers.slice();
        inDiapers.forEach(function (raw) {
          var d = normalizeDiaper(raw);
          if (!d) return;
          var key = d.time + "|" + d.pee + "|" + d.poop;
          if (seenD[key]) return;
          seenD[key] = true;
          dList.push(d);
          added++;
        });
        saveDiapers(dList);
      }

      renderAll();
      $("menuScrim").hidden = true;
      toast(added ? "Restored " + added + " records" : "Nothing new to add");
    };
    reader.readAsText(file);
  });

  $("aboutBtn").addEventListener("click", function () {
    alert(
      "Nursing Log\n\n" +
      "Everything you record is stored only on this phone, in this browser. " +
      "Nothing is sent anywhere and no account is needed.\n\n" +
      "Because of that, use \"Save backup file\" now and then. " +
      "Clearing the browser's site data would erase the log."
    );
  });

  /* ---------------- screen wake and dimming ---------------- */

  /* Test hook: the suite shortens this so it needn't wait half a minute. */
  var DIM_AFTER = window.NL_DIM_MS || 30000;
  var dimTimer = null;
  var wakeLock = null;

  function requestWake() {
    if (!navigator.wakeLock || wakeLock) return;
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
      lock.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () { /* denied or unsupported; dimming still works */ });
  }

  function releaseWake() {
    if (!wakeLock) return;
    var lock = wakeLock;
    wakeLock = null;
    lock.release().catch(function () {});
  }

  function sheetOpen() {
    return !$("editorScrim").hidden || !$("diaperScrim").hidden || !$("menuScrim").hidden;
  }

  function paintVeil() {
    $("veilTime").textContent = stopwatch(liveLeft() + liveRight());
    $("veilSide").textContent = SIDE_NAME[active.side] + " side";
  }

  /* Called on any touch, and whenever the timer starts or stops. */
  function wakeScreen() {
    clearTimeout(dimTimer);
    $("dimVeil").hidden = true;

    if (!active) { releaseWake(); return; }

    requestWake();
    dimTimer = setTimeout(function () {
      if (!active || sheetOpen()) return;
      paintVeil();
      $("dimVeil").hidden = false;
    }, DIM_AFTER);
  }

  document.addEventListener("pointerdown", wakeScreen, true);

  /* ---------------- keep it live ---------------- */

  setInterval(function () {
    if (active) {
      tick();
      if (!$("dimVeil").hidden) paintVeil();
    } else {
      renderFeedCard();
      renderDiaperCard();
    }
  }, 1000);

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { wakeLock = null; return; }   /* the browser drops the lock for us */
    feeds = loadFeeds();
    diapers = loadDiapers();
    active = loadActive();
    renderAll();
    wakeScreen();
  });

  /* Ask the browser not to evict the log if the phone runs short on space. */
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }

  renderAll();
  wakeScreen();

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline support is optional */ });
    });
  }
})();
</script>
</body>
</html>
